# Factorio profile.
#
# This file is the ONLY place in the project allowed to know anything about Factorio.
# The runtime loads it, validates it, and replays the macros; it never interprets them.
# Swapping in another game is a new file here, not new code in player2/.
#
# Bindings below were read from Factorio's own config.ini rather than guessed:
#   pause-game-controller = controller-righttrigger + controller-start
#   zoom-in-controller    = controller-righttrigger + controller-dpup
#   zoom-out-controller   = controller-righttrigger + controller-dpdown
#
# Requires `input-method=game-controller` in %APPDATA%\Factorio\config\config.ini.
# Factorio detects the virtual pad either way (it logs "Game controller connected"),
# but it ignores stick input while it believes it is in keyboard-and-mouse mode.

name = "factorio"
window_title_contains = "Factorio"

# Run this before and after an automated sequence. The runtime has no idea it pauses
# the game -- it only knows "replay the macro the profile nominated".
wrap_macro = "toggle_pause"

# Factorio's chat box is also its Lua console: "/c ..." executes arbitrary code, which
# would let the agent spawn items, reveal the map, or run anything at all. The runtime
# enforces these patterns without knowing what "/" means.
text_deny_patterns = ["^/", "^\\s*/"]

# The runtime forwards this string into a model's prompt unread -- it never parses or acts
# on it, same as every other field above. Bindings are Factorio's own controller DEFAULTS,
# read directly from config.ini (shipped commented-out but active; see PLATFORM-NOTES.md #4),
# not guessed. This is not a complete binding list, only what has actually been read there.
agent_notes = """
Controller bindings (Factorio's defaults, read from config.ini, not guessed):
  move: left stick. mine or attack whatever is targeted: X. open a machine, chest, or
  placed entity, and also place a held item: A. craft, inside a crafting menu: A.
  open the inventory / character / crafting screen: Y. rotate a held item: D-pad right,
  reverse: D-pad left. pick up the item under the cursor: D-pad down. cancel a held item
  or pipette a recipe from an entity: B. confirm a GUI prompt: Y.
  zoom in: right trigger + D-pad up. zoom out: right trigger + D-pad down. Use these to
  see more of the factory when the view feels too close to plan placement or pathing.
  Pausing and closing a menu are handled by this profile's own macros, not raw buttons.

The minimap/radar panel in the top-right corner shows a zoomed-out view of scouted terrain:
ore patches appear as colored dots matching their resource type, and any explored enemy
(biter) bases show up there too once within radar or vision range. Check it when deciding
which direction to walk -- it is usually faster than scanning the main view for resources
or threats, and it is the best way to tell whether enemies exist nearby at all before
spending time searching on foot.

Basic strategy for a fresh start, since hand-mining and manual crafting come before any
automation exists: walk onto an ore patch, tree, or rock and press X repeatedly to hand-mine
it -- no placed miner is needed to begin. Roughly in order: (1) hand-mine enough stone, coal,
and iron ore to craft a stone furnace and a few basic tools, (2) smelt iron plates by opening
the furnace (A) and placing ore and coal into it, (3) craft and place a lab, then feed it
science packs to unlock research, (4) once a burner mining drill and inserters are available,
automate ore extraction and smelting instead of continuing to hand-mine. Pollution from
smelting and production attracts biters over time, so expect enemies to become relevant the
longer a factory runs even if none are visible yet.

Suggested objective, absent any goal a session sets explicitly: prioritize automating
science pack production over any other activity. Mine and smelt the raw materials the
current tech tier needs, build out the production chain, and research whatever the tech
tree unlocks next. Treat combat and exploration as means to that end, not goals in
themselves.
"""

# RT is brought fully down BEFORE START is pressed, because analog channels interpolate
# between keyframes -- pressing both at t=0 would send START while the trigger was still
# ramping, and the chord might not register.
[macros.toggle_pause]
keyframes = [
  { t_ms = 0,   buttons = [], right_trigger = 0.0 },
  { t_ms = 40,  buttons = [], right_trigger = 1.0 },
  { t_ms = 80,  buttons = ["START"], right_trigger = 1.0 },
  { t_ms = 180, buttons = ["START"], right_trigger = 1.0 },
  { t_ms = 220, buttons = [], right_trigger = 0.0 },
]

# Same RT-before-chord shape as toggle_pause, same reason. One press = one zoom step; replay
# again for another step. From config.ini: zoom-in-controller = controller-righttrigger +
# controller-dpup.
[macros.zoom_in]
keyframes = [
  { t_ms = 0,   buttons = [], right_trigger = 0.0 },
  { t_ms = 40,  buttons = [], right_trigger = 1.0 },
  { t_ms = 80,  buttons = ["DPAD_UP"], right_trigger = 1.0 },
  { t_ms = 180, buttons = ["DPAD_UP"], right_trigger = 1.0 },
  { t_ms = 220, buttons = [], right_trigger = 0.0 },
]

# From config.ini: zoom-out-controller = controller-righttrigger + controller-dpdown.
[macros.zoom_out]
keyframes = [
  { t_ms = 0,   buttons = [], right_trigger = 0.0 },
  { t_ms = 40,  buttons = [], right_trigger = 1.0 },
  { t_ms = 80,  buttons = ["DPAD_DOWN"], right_trigger = 1.0 },
  { t_ms = 180, buttons = ["DPAD_DOWN"], right_trigger = 1.0 },
  { t_ms = 220, buttons = [], right_trigger = 0.0 },
]

# Closing an open menu. Discovered the hard way: two "live" recordings turned out to be a
# paused game sitting behind the Game menu, which the pause toggle cannot clear. From
# config.ini: confirm-gui-controller = controller-y.
[macros.menu_back]
keyframes = [
  { t_ms = 0,   buttons = [] },
  { t_ms = 40,  buttons = ["B"] },
  { t_ms = 140, buttons = ["B"] },
  { t_ms = 180, buttons = [] },
]

[macros.menu_confirm]
keyframes = [
  { t_ms = 0,   buttons = [] },
  { t_ms = 40,  buttons = ["Y"] },
  { t_ms = 140, buttons = ["Y"] },
  { t_ms = 180, buttons = [] },
]

# Opens the character/inventory screen; useful as a harmless "did anything happen at all"
# probe that does not move the character or touch the world.
[macros.open_character]
keyframes = [
  { t_ms = 0,   buttons = [] },
  { t_ms = 40,  buttons = ["Y"] },
  { t_ms = 140, buttons = ["Y"] },
  { t_ms = 180, buttons = [] },
]
