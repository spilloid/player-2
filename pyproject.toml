[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "player2"
version = "0.2.1"
requires-python = ">=3.12"
dependencies = ["vgamepad", "windows-capture", "mss"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]
# Voice is strictly opt-in. Nothing in the core runtime imports player2.audio,
# so a machine that never installs this group pays nothing for it -- no model
# weights, no audio backends, no import cost. Install with: pip install -e .[voice]
voice = ["faster-whisper", "piper-tts", "sounddevice"]
# Direct SDK transport for model-backed policies. Nothing in player2.agent.base or
# player2.agent.loop imports these -- only the concrete transport modules do, and each
# transport also accepts an injected client so tests never need the package installed.
# The CLI transport (codex exec) needs neither package and is the zero-credential fallback.
# Install with: pip install -e .[models]
models = ["anthropic", "openai"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["player2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep temp dirs inside the repo. The default lives in %TEMP%\pytest-of-<user>, which an
# elevated run creates under a different token -- after which every later non-elevated run
# fails with PermissionError before a single test executes.
addopts = "--basetemp=.pytest-tmp"
markers = [
    "smoke: touches real hardware or a real desktop; skips when unavailable",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
